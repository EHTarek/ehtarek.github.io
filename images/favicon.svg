<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mobile app developer">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#028AE2"/>
			<stop offset="1" stop-color="#015A9B"/>
		</linearGradient>
	</defs>

	<rect width="64" height="64" rx="14" fill="url(#tile)"/>

	<!-- phone body -->
	<rect x="19" y="9" width="26" height="46" rx="6" fill="#ffffff"/>
	<rect x="28.5" y="12.6" width="7" height="1.8" rx="0.9" fill="#015A9B"/>
	<rect x="28" y="49.8" width="8" height="1.8" rx="0.9" fill="#015A9B"/>

	<!-- code prompt on screen -->
	<polyline points="25.5,24 30.5,30 25.5,36" fill="none" stroke="#015A9B"
		stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
	<rect x="32" y="33.5" width="6.5" height="3" rx="1.5" fill="#015A9B"/>
</svg>
